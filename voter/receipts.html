<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>CoopVote Receipts</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&amp;family=DM+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/receipts.css?v=20260913" />
  <link rel="stylesheet" href="../assets/css/responsive.css?v=20260914-stable-controls" />
  <style>
    @media print {
      :root { --print-paper: #ffffff; --print-ink: #17243a; --print-rule: #a8b8cc; }
      @page { margin: 18mm; }
      html, body { height: auto !important; overflow: visible !important; background: var(--print-paper) !important; color: var(--print-ink) !important; }
      body > :not(#print-area) { display: none !important; }
      #print-area { display: block; color: var(--print-ink); background: var(--print-paper); }
      #print-area .receipt-card { background: var(--print-paper); color: var(--print-ink); border: 1px solid var(--print-rule); border-radius: 0; break-inside: avoid; }
      #print-area :is(.receipt-state, .receipt-note, dt, .receipt-code) { color: var(--print-ink); }
      #print-area .receipt-footer { border-color: var(--print-rule); }
      #print-area h1 { font: 700 20pt 'Playfair Display', Georgia, serif; margin-bottom: 18px; }
      #print-area .receipt-details { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
  <script src="../assets/js/viewport.js?v=20260911-layout1" defer></script>
  <link rel="stylesheet" href="../assets/css/themes.css?v=20260915">
  <script src="../assets/js/appearance.js?v=20260917-election-nav"></script>
  <link rel="stylesheet" href="../assets/css/navigation.css?v=20260917-election-nav" />
</head>
<body>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <div class="toast-wrap" id="toast-wrap"></div>

  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark"><svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg></div>
        <div class="logo-text">Coop<span>Vote</span></div>
      </div>

      <div class="sidebar-section">Member</div>
      <a class="nav-item" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" />
          <rect x="14" y="3" width="7" height="7" />
          <rect x="3" y="14" width="7" height="7" />
          <rect x="14" y="14" width="7" height="7" />
        </svg>
        Dashboard
      </a>
      <a class="nav-item" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        My Profile
      </a>

      <div class="sidebar-section">Election</div>
      <a class="nav-item" href="election.html" id="nav-election">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        Active Election
      </a>
      <a class="nav-item" href="candidates.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        View Candidates
      </a>
      <a class="nav-item" href="ballot.html" id="nav-ballot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 11 12 14 22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
        Cast My Vote
      </a>

      <div class="sidebar-section">Results</div>
      <a class="nav-item" href="results.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10" />
          <line x1="12" y1="20" x2="12" y2="4" />
          <line x1="6" y1="20" x2="6" y2="14" />
        </svg>
        Election Results
      </a>

      <a class="nav-item active" href="receipts.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h3" /></svg>My Vote Receipts</a>

      <div class="sidebar-footer">
        <div class="member-card">
          <div class="member-avatar" id="sidebar-avatar">?</div>
          <div class="member-info">
            <div class="member-name" id="sidebar-name">—</div>
            <div class="member-id" id="sidebar-id">—</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <header class="header">
        <button aria-label="Open the menu" class="hamburger" onclick="toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <div class="header-title">
          <h1>My Vote Receipts</h1>
          <p>Your voting confirmations, saved in one place</p>
        </div>
        <div class="header-actions">
          <button class="hbtn" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
          </button>
          <button class="hbtn" onclick="CoopVote.logout()"
            style="border:1px solid rgba(224,92,92,.2);color:var(--danger)" title="Logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>
      </header>

      
      <main class="content">
        <div class="receipt-intro">
          <p>Reopen or print your voting confirmations at any time.</p>
          <button type="button" class="receipt-button" id="refresh-receipts">Refresh</button>
        </div>
        <p class="receipt-status" id="receipt-status" role="status">Loading your receipts…</p>
        <div class="receipt-list" id="receipt-list" aria-busy="true"></div>
      </main>
    </div>
  </div>
  <div id="print-area"></div>
  <script src="../assets/js/app.js?v=20260917-election-nav"></script>
  <script src="../assets/js/receipts.js?v=20260914-cooldown"></script>
</body>
</html>
