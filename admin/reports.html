<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>CoopVote — Reports</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --navy: #0b1931;
      --navy2: #0f2040;
      --navy3: #162a52;
      --navy4: #1e3566;
      --gold: #c9a84c;
      --gold2: #e8c96a;
      --white: #ffffff;
      --muted: #7a8ba0;
      --muted2: #a8b8cc;
      --border: rgba(255, 255, 255, .08);
      --danger: #e05c5c;
      --success: #4caf82;
      --warn: #e0a030;
      --info: #4a9fd4;
      --sidebar-w: 260px;
      --header-h: 64px;
      --radius: 14px;
    }

    html,
    body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      overflow: hidden
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .12);
      border-radius: 99px
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes shimmer {

      0%,
      100% {
        left: -70%
      }

      50% {
        left: 140%
      }
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(224, 92, 92, .4)
      }

      50% {
        box-shadow: 0 0 0 5px rgba(224, 92, 92, 0)
      }
    }

    @keyframes sweep {
      0% {
        transform: translateX(-100%)
      }

      100% {
        transform: translateX(300%)
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--navy2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      transition: transform .3s cubic-bezier(.22, 1, .36, 1);
      z-index: 200
    }

    .sidebar-logo {
      padding: 28px 22px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(201, 168, 76, .3);
      position: relative;
      overflow: hidden
    }

    .logo-mark::after {
      content: '';
      position: absolute;
      top: 0;
      left: -70%;
      width: 40%;
      height: 100%;
      background: rgba(255, 255, 255, .3);
      transform: skewX(-20deg);
      animation: shimmer 4s ease-in-out infinite
    }

    .logo-mark svg {
      width: 20px;
      height: 20px;
      fill: var(--navy)
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 800
    }

    .logo-text span {
      color: var(--gold)
    }

    .sidebar-section {
      padding: 20px 14px 8px;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 14px;
      margin: 2px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: .875rem;
      font-weight: 500;
      color: var(--muted2);
      transition: all .2s;
      position: relative;
      white-space: nowrap;
      text-decoration: none;
      overflow: hidden
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .06);
      color: var(--white)
    }

    .nav-item.active {
      background: rgba(201, 168, 76, .14);
      color: var(--gold);
      font-weight: 600
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--gold)
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      opacity: .7
    }

    .nav-item.active svg {
      opacity: 1
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0
    }

    .admin-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .05);
      cursor: pointer;
      transition: background .2s
    }

    .admin-card:hover {
      background: rgba(255, 255, 255, .09)
    }

    .admin-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--navy4), var(--navy3));
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      color: var(--gold);
      flex-shrink: 0
    }

    .admin-info {
      flex: 1;
      overflow: hidden
    }

    .admin-name {
      font-size: .82rem;
      font-weight: 600
    }

    .admin-role {
      font-size: .7rem;
      color: var(--muted);
      margin-top: 1px
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0
    }

    .header {
      height: var(--header-h);
      flex-shrink: 0;
      background: rgba(11, 25, 49, .85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
      z-index: 100
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted2);
      padding: 6px;
      border-radius: 8px;
      transition: color .2s, background .2s
    }

    .hamburger:hover {
      color: var(--white);
      background: rgba(255, 255, 255, .07)
    }

    .header-title {
      flex: 1
    }

    .header-title h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700
    }

    .header-title p {
      font-size: .75rem;
      color: var(--muted);
      margin-top: 1px
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .hbtn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, .06);
      color: var(--muted2);
      cursor: pointer;
      transition: all .2s;
      position: relative
    }

    .hbtn:hover {
      background: rgba(255, 255, 255, .12);
      color: var(--white)
    }

    .hbtn svg {
      width: 18px;
      height: 18px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      text-decoration: none
    }

    .btn svg {
      width: 15px;
      height: 15px
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--navy);
      box-shadow: 0 4px 16px rgba(201, 168, 76, .25)
    }

    .btn-gold:hover {
      filter: brightness(1.08);
      transform: translateY(-1px)
    }

    .btn-outline {
      background: rgba(255, 255, 255, .06);
      color: var(--muted2);
      border: 1px solid var(--border)
    }

    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201, 168, 76, .07)
    }

    .report-print { padding:8px 14px; font-size:.8rem; }
    .report-print:disabled { opacity:.45; cursor:not-allowed; }
    .report-print:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }

    /* ── CONTENT ── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px
    }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      animation: fadeUp .5s cubic-bezier(.22, 1, .36, 1) both
    }

    .filter-select {
      padding: 10px 14px;
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted2);
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      outline: none;
      cursor: pointer;
      transition: border-color .2s
    }

    .filter-select:focus {
      border-color: var(--gold)
    }

    .date-range {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 14px
    }

    .date-range input {
      background: none;
      border: none;
      color: var(--muted2);
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      outline: none;
      padding: 10px 0;
      width: 130px
    }

    .date-range input::-webkit-calendar-picker-indicator {
      filter: invert(.4)
    }

    .date-sep {
      color: var(--muted);
      font-size: .8rem
    }

    .spacer {
      flex: 1
    }

    .export-quick {
      display: flex;
      gap: 7px
    }

    .qbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border: none;
      border-radius: 9px;
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s
    }

    .qbtn svg {
      width: 13px;
      height: 13px
    }

    .qbtn.pdf {
      background: rgba(224, 92, 92, .12);
      color: var(--danger)
    }

    .qbtn.pdf:hover {
      background: rgba(224, 92, 92, .22)
    }

    .qbtn.excel {
      background: rgba(76, 175, 130, .12);
      color: var(--success)
    }

    .qbtn.excel:hover {
      background: rgba(76, 175, 130, .22)
    }

    .qbtn.csv {
      background: rgba(74, 159, 212, .12);
      color: var(--info)
    }

    .qbtn.csv:hover {
      background: rgba(74, 159, 212, .22)
    }

    /* ── NO DATA STATE ── */
    .page-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      color: var(--muted);
      padding: 56px 20px;
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 20px;
      animation: fadeUp .5s .05s cubic-bezier(.22, 1, .36, 1) both
    }

    .page-empty svg {
      width: 48px;
      height: 48px;
      opacity: .25
    }

    .page-empty h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--muted2)
    }

    .page-empty p {
      font-size: .84rem;
      line-height: 1.7;
      max-width: 360px
    }

    .page-empty a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--navy);
      font-size: .84rem;
      font-weight: 600;
      text-decoration: none;
      margin-top: 4px;
      transition: filter .2s
    }

    .page-empty a:hover {
      filter: brightness(1.08)
    }

    /* ── SUMMARY CARDS ── */
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      animation: fadeUp .5s .05s cubic-bezier(.22, 1, .36, 1) both
    }

    .s-card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform .2s;
      cursor: default
    }

    .s-card:hover {
      transform: translateY(-2px)
    }

    .s-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .s-icon svg {
      width: 19px;
      height: 19px
    }

    .s-icon.gold {
      background: rgba(201, 168, 76, .15)
    }

    .s-icon.gold svg {
      color: var(--gold)
    }

    .s-icon.green {
      background: rgba(76, 175, 130, .15)
    }

    .s-icon.green svg {
      color: var(--success)
    }

    .s-icon.blue {
      background: rgba(74, 159, 212, .15)
    }

    .s-icon.blue svg {
      color: var(--info)
    }

    .s-icon.purple {
      background: rgba(155, 127, 212, .15)
    }

    .s-icon.purple svg {
      color: #9b7fd4
    }

    .s-val {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1;
      color: var(--white)
    }

    .s-val.empty {
      color: var(--muted);
      font-size: 1.3rem
    }

    .s-label {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 3px
    }

    .s-bar {
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .07);
      overflow: hidden;
      margin-top: 10px
    }

    .s-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 1.2s cubic-bezier(.22, 1, .36, 1);
      width: 0%;
      position: relative;
      overflow: hidden
    }

    .s-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .25), transparent);
      animation: sweep 2.5s ease-in-out infinite
    }

    .s-fill.gold {
      background: linear-gradient(90deg, var(--gold), var(--gold2))
    }

    .s-fill.green {
      background: linear-gradient(90deg, #27ae60, var(--success))
    }

    .s-fill.blue {
      background: linear-gradient(90deg, #2980b9, var(--info))
    }

    .s-fill.purple {
      background: linear-gradient(90deg, #7c5cbf, #9b7fd4)
    }

    /* ── TWO COL ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px
    }

    .three-col {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px
    }

    /* ── CARD ── */
    .card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeUp .5s .12s cubic-bezier(.22, 1, .36, 1) both
    }

    .card-head {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap
    }

    .card-title {
      font-size: .9rem;
      font-weight: 600
    }

    .card-sub {
      font-size: .74rem;
      color: var(--muted);
      margin-top: 2px
    }

    .chip {
      padding: 6px 12px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .75rem;
      font-weight: 500;
      background: rgba(255, 255, 255, .06);
      color: var(--muted2);
      transition: all .2s
    }

    .chip.active,
    .chip:hover {
      background: rgba(201, 168, 76, .15);
      color: var(--gold)
    }

    /* ── HORIZONTAL BAR CHART ── */
    .hbar-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 20px
    }

    

    .hbar-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px
    }

    .hbar-name {
      font-size: .84rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 7px
    }

    .hbar-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .hbar-count {
      font-family: 'Playfair Display', serif;
      font-size: .95rem;
      font-weight: 700
    }

    .hbar-track {
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .06);
      overflow: hidden
    }

    .hbar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 1.2s cubic-bezier(.22, 1, .36, 1);
      position: relative;
      overflow: hidden
    }

    .hbar-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .2), transparent);
      animation: sweep 3s ease-in-out infinite
    }

    .hbar-pct {
      font-size: .7rem;
      color: var(--muted);
      margin-top: 4px;
      text-align: right
    }

    /* ── DONUT ── */
    .donut-wrap {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
      padding: 18px 20px
    }

    .donut-svg-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      flex-shrink: 0
    }

    .donut-svg-wrap svg {
      transform: rotate(-90deg)
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center
    }

    .donut-val {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold)
    }

    .donut-sub {
      font-size: .63rem;
      color: var(--muted);
      margin-top: 2px
    }

    .donut-legend {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .leg-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .8rem
    }

    .leg-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .leg-label {
      color: var(--muted2);
      flex: 1
    }

    .leg-val {
      font-weight: 600;
      color: var(--white)
    }

    /* ── RESULTS TABLE ── */
    .table-scroll {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .83rem;
      min-width: 560px
    }

    thead tr {
      background: rgba(255, 255, 255, .03);
      border-bottom: 1px solid var(--border)
    }

    th {
      padding: 11px 16px;
      text-align: left;
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .04);
      vertical-align: middle;
      transition: background .15s
    }

    tr:hover td {
      background: rgba(255, 255, 255, .03)
    }

    tr:last-child td {
      border-bottom: none
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: .69rem;
      font-weight: 700;
      white-space: nowrap
    }

    .badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor
    }

    .badge-gold {
      background: rgba(201, 168, 76, .15);
      color: var(--gold)
    }

    .badge-muted {
      background: rgba(255, 255, 255, .07);
      color: var(--muted)
    }

    .rank-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .73rem;
      font-weight: 700;
      flex-shrink: 0
    }

    .rank-1 {
      background: rgba(201, 168, 76, .2);
      color: var(--gold);
      border: 1px solid rgba(201, 168, 76, .3)
    }

    .rank-2 {
      background: rgba(255, 255, 255, .08);
      color: var(--muted2)
    }

    .rank-3 {
      background: rgba(205, 127, 50, .15);
      color: #cd7f32
    }

    .inline-bar {
      height: 5px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .06);
      overflow: hidden;
      width: 72px;
      display: inline-block;
      vertical-align: middle
    }

    .inline-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 1.2s cubic-bezier(.22, 1, .36, 1)
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 8px
    }

    .pag-info {
      font-size: .76rem;
      color: var(--muted)
    }

    .pag-btns {
      display: flex;
      gap: 5px
    }

    .pag-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted2);
      cursor: pointer;
      font-size: .78rem;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif
    }

    .pag-btn:hover {
      border-color: var(--gold);
      color: var(--gold)
    }

    .pag-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy);
      font-weight: 700
    }

    /* ── EXPORT CARDS ── */
    .export-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      animation: fadeUp .5s .22s cubic-bezier(.22, 1, .36, 1) both
    }

    .export-card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform .2s, box-shadow .2s
    }

    .export-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .3)
    }

    .export-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .export-icon svg {
      width: 22px;
      height: 22px
    }

    .export-icon.pdf {
      background: rgba(224, 92, 92, .12)
    }

    .export-icon.pdf svg {
      color: var(--danger)
    }

    .export-icon.excel {
      background: rgba(76, 175, 130, .12)
    }

    .export-icon.excel svg {
      color: var(--success)
    }

    .export-icon.csv {
      background: rgba(74, 159, 212, .12)
    }

    .export-icon.csv svg {
      color: var(--info)
    }

    .export-icon.summary {
      background: rgba(201, 168, 76, .12)
    }

    .export-icon.summary svg {
      color: var(--gold)
    }

    .export-icon.audit {
      background: rgba(155, 127, 212, .12)
    }

    .export-icon.audit svg {
      color: #9b7fd4
    }

    .export-icon.archive {
      background: rgba(224, 160, 48, .12)
    }

    .export-icon.archive svg {
      color: var(--warn)
    }

    .export-title {
      font-size: .9rem;
      font-weight: 600;
      margin-bottom: 3px
    }

    .export-desc {
      font-size: .76rem;
      color: var(--muted);
      line-height: 1.6
    }

    .export-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--border)
    }

    .export-size {

    }

    .export-btn {

      align-items: center;

      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .78rem;
      font-weight: 600;
      transition: all .2s
    }

    .export-btn.pdf {
      background: rgba(224, 92, 92, .12);
      color: var(--danger)
    }

    .export-btn.pdf:hover {
      background: rgba(224, 92, 92, .25)
    }

    .export-btn.excel {
      background: rgba(76, 175, 130, .12);
      color: var(--success)
    }

    .export-btn.excel:hover {
      background: rgba(76, 175, 130, .25)
    }

    .export-btn.csv {
      background: rgba(74, 159, 212, .12);
      color: var(--info)
    }

    .export-btn.csv:hover {
      background: rgba(74, 159, 212, .25)
    }

    .export-btn.gold {

      color: var(--gold)
    }

    .export-btn.gold:hover {

    }

    }

    .export-disabled {

    }

      font-size: .72rem;
      color: var(--muted);
      font-style: italic;
      margin-top: 4px
    }

    /* ── EMPTY SECTION ── */
    .empty-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 10px;
      color: var(--muted);
      text-align: center
    }

    .empty-section svg {
      width: 34px;
      height: 34px;
      opacity: .28
    }

    .empty-section p {
      font-size: .82rem
    }

    /* ── SECTION HEADER ── */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700
    }

    .section-sub {
      font-size: .76rem;
      color: var(--muted);
      margin-top: 2px
    }

    /* ── TOAST ── */
    .toast-wrap {
      position: fixed;
      top: 78px;
      right: 24px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none
    }

    .toast {
      background: var(--navy3);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: .83rem;
      min-width: 230px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .4);
      transform: translateX(130%);
      transition: transform .35s cubic-bezier(.22, 1, .36, 1)
    }

    .toast.show {
      transform: translateX(0)
    }

    .toast-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .toast.success .toast-icon {
      background: rgba(76, 175, 130, .15)
    }

    .toast.success .toast-icon svg {
      color: var(--success)
    }

    .toast.error .toast-icon {
      background: rgba(224, 92, 92, .15)
    }

    .toast.error .toast-icon svg {
      color: var(--danger)
    }

    .toast.info .toast-icon {
      background: rgba(74, 159, 212, .15)
    }

    .toast.info .toast-icon svg {
      color: var(--info)
    }

    .toast.warn .toast-icon {
      background: rgba(224, 160, 48, .15)
    }

    .toast.warn .toast-icon svg {
      color: var(--warn)
    }

   

    .toast-title {
      font-size: .82rem;
      font-weight: 600
    }

    .toast-sub {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 2px
    }

    /* ── OVERLAY ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      z-index: 150;
      backdrop-filter: blur(4px)
    }

    /* ── RESPONSIVE ── */
    @media(max-width:1100px) {
      .two-col {
        grid-template-columns: 1fr
      }

      .three-col {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:900px) {
      .summary-strip {
        grid-template-columns: repeat(2, 1fr)
      }

      .export-grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: 8px 0 40px rgba(0, 0, 0, .5)
      }

      .sidebar.open {
        transform: translateX(0)
      }

      .overlay {
        display: block;
        pointer-events: none;
        opacity: 0;
        transition: opacity .3s
      }

      .overlay.show {
        pointer-events: all;
        opacity: 1
      }

      .hamburger {
        display: flex
      }

      .content {
        padding: 16px
      }

      .header {
        padding: 0 16px
      }

      .export-grid {
        grid-template-columns: 1fr
      }

      .filter-bar {
        gap: 8px
      }
    }

    @media(max-width:480px) {
      .summary-strip {
        grid-template-columns: 1fr 1fr
      }

        font-size: 1.4rem
      }
    }
  
    /* ── Layout fix ──────────────────────────────────────────
       .content is a flex column, and flex items shrink by default.
       Once the page grew taller than the viewport every section was
       squashed, and any card with overflow:hidden clipped its own
       text (the welcome hero showed the name but hid the meta line).
       Sections keep their natural height; .content already scrolls. */
    .content > * { flex-shrink: 0; }

    /* ── Empty-state action icons ────────────────────────────
       The illustration rule above (.page-empty svg and friends) also
       matches the icon inside the empty state's button, and a rule
       beats the svg's own width/height attributes. Keep those icons
       button-sized so the call to action matches every other button. */
    .page-empty a svg, .page-empty button svg,
    .empty-section a svg, .empty-section button svg,
    .page-state a svg, .page-state button svg,
    .hero-empty a svg, .hero-empty button svg {
      width: 14px;
      height: 14px;
      opacity: 1;
    }
  </style>

  <script>
    /* ─────────────────────────────────────────
       STATE
    ───────────────────────────────────────── */
    let reportData = null;   // set by initReports(data)

    const POS_COLORS = ['#c9a84c', '#4a9fd4', '#4caf82', '#9b7fd4', '#e0a030', '#e05c5c'];

    /* ─────────────────────────────────────────
       SIDEBAR
    ───────────────────────────────────────── */
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }

    /* ─────────────────────────────────────────
       LOAD REPORTS
       ─────────────────────────────────────────
       Replace with real API:
       fetch('/api/reports?election=<id>')
         .then(r => r.json())
         .then(data => initReports(data))
         .catch(() => initReports(null));
    
       Expected shape:
       {
         elections: [{ id, title }],          // for selector
         selected: {
           id, title, startDate, endDate,
           totalVoters, votesCast, candidates, duration,
           positionBreakdown: [
             { name, votesCast, totalVoters }
           ],
           candidateResults: [
             { rank, name, position, votes, totalInPosition, winner }
           ]
         }
       }
    ───────────────────────────────────────── */
    function loadReports(electionId) {
      const route = electionId ? `reports&election=${encodeURIComponent(electionId)}` : 'reports';
      return CoopVote.api(route)
        .then(data => initReports(data))
        .catch(err => {
          initReports(null);
          CoopVote.toast(err.message || 'Failed to load report data.', 'error');
        });
    }

    function initReports(data) {
      reportData = data;
      renderPage();
    }

    /* ─────────────────────────────────────────
       FILTERS
       ─────────────────────────────────────────
       All of these narrow what is already loaded, so they re-render
       rather than going back to the server. Only the election selector
       needs a fresh request.
    ───────────────────────────────────────── */
    let fPosition = '';       // '' = every position
    let fWinnersOnly = false; // true = winners only
    let fDateFrom = '';
    let fDateTo = '';

    function setPositionFilter(name) {
      fPosition = name || '';
      renderPage(true);
    }

    function setResultFilter(winnersOnly) {
      fWinnersOnly = !!winnersOnly;
      renderPage(true);
    }

    function setDateFilter(which, value) {
      if (which === 'from') fDateFrom = value || '';
      else fDateTo = value || '';

      /* A backwards range would silently hide everything. */
      if (fDateFrom && fDateTo && fDateFrom > fDateTo) {
        showToast('The start date is after the end date.', 'warn');
      }
      renderPage();
    }

    function clearDateFilter() {
      fDateFrom = '';
      fDateTo = '';
      renderPage();
    }

    /* ─────────────────────────────────────────
       RENDER PAGE
    ───────────────────────────────────────── */
    function renderPage(preserveLayout = false) {
      const c = document.getElementById('main-content');
      const scrollTop = c.scrollTop;
      const oldTableScroll = c.querySelector('.cv-report-results .table-scroll');
      const tableScroll = oldTableScroll ? { left: oldTableScroll.scrollLeft, top: oldTableScroll.scrollTop } : null;
      const focusedControl = c.contains(document.activeElement) ? document.activeElement.id : '';
      c.classList.toggle('cv-filter-update', preserveLayout);
      const hasData = reportData && reportData.selected;

      /* ── Filter Bar (always visible) ── */
      const elections = reportData?.elections || [];
      const sel = reportData?.selected;

      /* The date range narrows which elections the selector offers. */
      const inRange = e => {
        if (!fDateFrom && !fDateTo) return true;
        if (!e.start || !e.end) return true;          // undated: never hide it
        if (fDateFrom && e.end < fDateFrom) return false;
        if (fDateTo && e.start > fDateTo) return false;
        return true;
      };
      const shown = elections.filter(inRange);

      const filterHTML = `
    <div class="filter-bar">
      <select class="filter-select" onchange="loadReports(this.value)" id="el-select">
        <option value="">— Select Election —</option>
        ${shown.map(e => `<option value="${e.id}" ${sel && sel.id === e.id ? 'selected' : ''}>${esc(e.title)}</option>`).join('')}
      </select>
      <div class="date-range">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <input type="date" id="date-from" title="Start date" value="${fDateFrom}" onchange="setDateFilter('from', this.value)"/>
        <span class="date-sep">—</span>
        <input type="date" id="date-to" title="End date" value="${fDateTo}" onchange="setDateFilter('to', this.value)"/>
      </div>
      ${(fDateFrom || fDateTo)
          ? `<button class="chip" onclick="clearDateFilter()" title="Clear the date range">
               ${shown.length} of ${elections.length} elections · Clear
             </button>`
          : ''}
      <div class="spacer"></div>
      <button type="button" class="btn btn-outline report-print" onclick="printReport()" ${hasData ? '' : 'disabled'}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Print / PDF
      </button>
    </div>`;

      if (!hasData) {
        c.innerHTML = filterHTML + `
      <div class="page-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <h2>No Report Data Available</h2>
        <p>Select an election from the dropdown above, or run an election first to generate report data.</p>
        <a href="election-management.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Go to Election Management
        </a>
      </div>
      `;
        return;
      }

      const d = sel;
      const pct = d.totalVoters > 0 ? Math.round((d.votesCast / d.totalVoters) * 100) : 0;
      const remaining = Math.max(0, d.totalVoters - d.votesCast);
      const pd = d.positionBreakdown || [];
      /* Filter the candidate table by position and by winners-only. */
      const allResults = d.candidateResults || [];
      const results = allResults.filter(r =>
        (!fPosition || r.position === fPosition) && (!fWinnersOnly || r.winner)
      );
      const filtered = results.length !== allResults.length;
      const maxPosV = Math.max(...pd.map(p => p.votesCast), 1);
      const circ = 226.2; // 2π×36

      c.innerHTML = filterHTML + `

    <!-- SUMMARY STRIP -->
    <div class="summary-strip">
      <div class="s-card">
        <div class="s-icon gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        <div><div class="s-val">${(d.totalVoters || 0).toLocaleString()}</div><div class="s-label">Registered Voters</div>
        <div class="s-bar"><div class="s-fill gold" data-w="100%" style="width:0%"></div></div></div>
      </div>
      <div class="s-card">
        <div class="s-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
        <div><div class="s-val">${(d.votesCast || 0).toLocaleString()}</div><div class="s-label">Votes Cast</div>
        <div class="s-bar"><div class="s-fill green" data-w="${pct}%" style="width:0%"></div></div></div>
      </div>
      <div class="s-card">
        <div class="s-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        <div><div class="s-val">${(d.candidates || 0)}</div><div class="s-label">Total Candidates</div>
        <div class="s-bar"><div class="s-fill blue" data-w="60%" style="width:0%"></div></div></div>
      </div>
      <div class="s-card">
        <div class="s-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div><div class="s-val">${d.duration || '—'}</div><div class="s-label">Election Duration</div>
        <div class="s-bar"><div class="s-fill purple" data-w="${pct}%" style="width:0%"></div></div></div>
      </div>
    </div>

    <!-- CHARTS ROW -->
    <div class="two-col equal-height-grid">

      <!-- VOTES BY POSITION -->
      <div class="card" style="animation-delay:.12s">
        <div class="card-head">
          <div><div class="card-title">Votes by Position</div><div class="card-sub">Total votes cast per contested position</div></div>
          <div style="display:flex;gap:6px">
            <button class="chip active" onclick="setChartMode(this,'votes')">Votes</button>
            <button class="chip" onclick="setChartMode(this,'pct')">%</button>
          </div>
        </div>
        ${pd.length > 0
          ? `<div class="hbar-list" id="hbar-list">
              ${pd.map((p, i) => {
            const pp = p.totalVoters > 0 ? Math.round((p.votesCast / p.totalVoters) * 100) : 0;
            const bw = Math.round((p.votesCast / maxPosV) * 100);
            const col = POS_COLORS[i % POS_COLORS.length];
            return `<div class="hbar-item" data-votes="${p.votesCast}" data-pct="${pp}" data-maxv="${maxPosV}" data-maxt="${d.totalVoters}">
                  <div class="hbar-meta">
                    <div class="hbar-name"><div class="hbar-dot" style="background:${col}"></div>${esc(p.name)}</div>
                    <div class="hbar-count" style="color:${col}" id="hb-val-${i}">${p.votesCast.toLocaleString()}</div>
                  </div>
                  <div class="hbar-track"><div class="hbar-fill" id="hb-fill-${i}" data-w="${bw}%" style="width:0%;background:linear-gradient(90deg,${col},${col}99)"></div></div>
                  <div class="hbar-pct" id="hb-pct-${i}">${pp}% participation</div>
                </div>`;
          }).join('')}
            </div>`
          : `<div class="empty-section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><p>No position data available.</p></div>`
        }
      </div>

      <!-- TURNOUT DONUT -->
      <div class="card" style="animation-delay:.16s">
        <div class="card-head"><div><div class="card-title">Voter Turnout</div><div class="card-sub">Participation breakdown</div></div></div>
        <div class="donut-wrap">
          <div class="donut-svg-wrap">
            <svg width="130" height="130" viewBox="0 0 130 130">
              <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4caf82"/><stop offset="100%" stop-color="#7be8b4"/></linearGradient></defs>
              <circle cx="65" cy="65" r="48" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="16"/>
              <circle cx="65" cy="65" r="48" fill="none" stroke="url(#dg)" stroke-width="16"
                stroke-dasharray="301.6" stroke-dashoffset="301.6" id="donut-arc" stroke-linecap="round"/>
              <circle cx="65" cy="65" r="48" fill="none" stroke="rgba(74,159,212,.25)" stroke-width="16"
                stroke-dasharray="301.6" stroke-dashoffset="0" id="donut-rem" stroke-linecap="round"/>
            </svg>
            <div class="donut-center"><div class="donut-val">${pct}%</div><div class="donut-sub">Turnout</div></div>
          </div>
          <div class="donut-legend">
            <div class="leg-item"><div class="leg-dot" style="background:var(--success)"></div><span class="leg-label">Voted</span><span class="leg-val">${(d.votesCast || 0).toLocaleString()}</span></div>
            <div class="leg-item"><div class="leg-dot" style="background:rgba(74,159,212,.5)"></div><span class="leg-label">Not Voted</span><span class="leg-val">${remaining.toLocaleString()}</span></div>
            <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
              <div style="font-size:.7rem;color:var(--muted)">Election Period</div>
              <div style="font-size:.8rem;font-weight:600;margin-top:3px">${d.startDate || '—'} – ${d.endDate || '—'}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- CANDIDATE RESULTS TABLE -->
    <div class="section-head" style="animation:fadeUp .5s .2s cubic-bezier(.22,1,.36,1) both">
      <div>
        <div class="section-title">Candidate Vote Summary</div>
        <div class="section-sub">Detailed results per candidate and position</div>
      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <button id="report-all" class="chip ${fWinnersOnly ? '' : 'active'}" onclick="setResultFilter(false)">All</button>
        <button id="report-winners" class="chip ${fWinnersOnly ? 'active' : ''}" onclick="setResultFilter(true)">Winners</button>
        <select id="report-position-filter" aria-label="Filter results by position" class="filter-select" style="padding:6px 10px;font-size:.78rem"
          onchange="setPositionFilter(this.value)">
          <option value="">All Positions</option>
          ${pd.map(p => `<option value="${esc(p.name)}" ${fPosition === p.name ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="card cv-report-results" style="animation-delay:.22s">
        <div class="table-scroll">
          <table class="cv-data-table cv-report">
              <colgroup><col style="width:7%"><col style="width:24%"><col style="width:18%"><col style="width:9%"><col style="width:8%"><col style="width:20%"><col style="width:14%"></colgroup>
            <thead><tr>
              <th>Rank</th><th>Candidate</th><th>Position</th><th>Votes</th><th>Share</th><th>Progress</th><th>Status</th>
            </tr></thead>
            <tbody>
              ${results.map((r, i) => {
            const pct2 = r.totalInPosition > 0 ? Math.round((r.votes / r.totalInPosition) * 100) : 0;
            const posIdx = pd.findIndex(p => p.name === r.position);
            const col = POS_COLORS[posIdx >= 0 ? posIdx % POS_COLORS.length : i % POS_COLORS.length];
            const rankN = r.rank || i + 1;
            const rankCls = rankN === 1 ? 'rank-1' : rankN === 2 ? 'rank-2' : rankN === 3 ? 'rank-3' : '';
            return `<tr>
                  <td><div style="display:flex;align-items:center;justify-content:center">
                    <div class="rank-num ${rankCls}">${rankN}</div>
                  </div></td>
                  <td style="font-weight:600">${esc(r.name)}</td>
                  <td><span class="badge" style="background:${col}22;color:${col};border:none">${esc(r.position)}</span></td>
                  <td><span style="font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--gold)">${(r.votes || 0).toLocaleString()}</span></td>
                  <td style="color:var(--muted2)">${pct2}%</td>
                  <td><div style="display:flex;align-items:center;gap:8px">
                    <div class="inline-bar"><div class="inline-fill" data-w="${pct2}%" style="width:0%;background:linear-gradient(90deg,${col},${col}99)"></div></div>
                    <span style="font-size:.7rem;color:var(--muted)">${pct2}%</span>
                  </div></td>
                  <td>${r.winner ? `<span class="badge badge-gold">Winner</span>` : `<span class="badge badge-muted">—</span>`}</td>
                </tr>`;
          }).join('') || `<tr><td colspan="7" class="cv-empty-row"><p>${allResults.length ? 'No candidate matches the current filter.' : 'No candidate result data available.'}</p>${allResults.length ? `<button class="chip" onclick="setPositionFilter('');setResultFilter(false)">Clear filters</button>` : ''}</td></tr>`}
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <div class="pag-info">Showing ${results.length} candidate${results.length !== 1 ? 's' : ''}${filtered ? ` of ${allResults.length}` : ''}</div>
          
        </div>
    </div>

    <!-- EXPORT CARDS -->
    `;
      if (preserveLayout) {
        c.scrollTop = scrollTop;
        const viewport = c.querySelector('.cv-report-results .table-scroll');
        if (viewport && tableScroll) { viewport.scrollLeft = tableScroll.left; viewport.scrollTop = tableScroll.top; }
        if (focusedControl) document.getElementById(focusedControl)?.focus({ preventScroll: true });
      }

      /* animate bars & donut */
      setTimeout(() => {
        document.querySelectorAll('.s-fill[data-w],.hbar-fill[data-w],.inline-fill[data-w]').forEach((b, i) => {
          b.style.transition = `width 1.1s ${i * .04}s cubic-bezier(.22,1,.36,1)`;
          b.style.width = b.dataset.w;
        });
        const circ2 = 301.6;
        const arc = document.getElementById('donut-arc');
        const rem = document.getElementById('donut-rem');
        if (arc) { arc.style.transition = 'stroke-dashoffset 1.5s .2s cubic-bezier(.22,1,.36,1)'; arc.style.strokeDashoffset = circ2 * (1 - pct / 100) }
        if (rem) { rem.style.strokeDasharray = `${circ2 * (1 - pct / 100)} ${circ2}`; rem.style.strokeDashoffset = `-${circ2 * (pct / 100)}` }
      }, 200);
    }

    /* ─────────────────────────────────────────
       EXPORT CARDS HTML
    ───────────────────────────────────────── */

    /* ─────────────────────────────────────────
       CHART MODE TOGGLE (Votes ↔ %)
    ───────────────────────────────────────── */
    function setChartMode(btn, mode) {
      document.querySelectorAll('.card-head .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const items = document.querySelectorAll('#hbar-list .hbar-item');
      items.forEach((item, i) => {
        const votes = parseInt(item.dataset.votes);
        const pct2 = parseInt(item.dataset.pct);
        const maxV = parseInt(item.dataset.maxv);
        const maxT = parseInt(item.dataset.maxt);
        const fill = document.getElementById(`hb-fill-${i}`);
        const val = document.getElementById(`hb-val-${i}`);
        const pctEl = document.getElementById(`hb-pct-${i}`);
        if (mode === 'pct') {
          if (fill) { fill.style.transition = 'width .7s cubic-bezier(.22,1,.36,1)'; fill.style.width = pct2 + '%' }
          if (val) val.textContent = pct2 + '%';
          if (pctEl) pctEl.textContent = votes.toLocaleString() + ' votes';
        } else {
          const bw = Math.round((votes / maxV) * 100);
          if (fill) { fill.style.transition = 'width .7s cubic-bezier(.22,1,.36,1)'; fill.style.width = bw + '%' }
          if (val) val.textContent = votes.toLocaleString();
          if (pctEl) pctEl.textContent = pct2 + '% participation';
        }
      });
    }

    /* ─────────────────────────────────────────
       EXPORT
    ───────────────────────────────────────── */

    /* ─────────────────────────────────────────
       TOAST
    ───────────────────────────────────────── */
    function showToast(title, type = 'info', sub = '') {
      const wrap = document.getElementById('toast-wrap');
      const iconMap = {
        success: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`,
        error: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/></svg>`,
        warn: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>`,
        info: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
      };
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<div class="toast-icon">${iconMap[type] || iconMap.info}</div><div class="toast-text"><div class="toast-title">${title}</div>${sub ? `<div class="toast-sub">${sub}</div>` : ''}</div>`;
      wrap.appendChild(t);
      CoopVote.presentToast(t, 3500);
    }

    /* ─────────────────────────────────────────
       INIT
    ───────────────────────────────────────── */
    function printReport() {
      const id = Number(reportData?.selected?.id);
      if (!Number.isSafeInteger(id) || id < 1) return;
      return CoopVote.download('operations/report&election=' + id + '&format=html', { preview: true });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const requested = Number(new URLSearchParams(window.location.search).get('election'));
      const initialRoute = Number.isSafeInteger(requested) && requested > 0 ? 'reports&election=' + requested : 'reports';
      CoopVote.guard('admin').then(() => CoopVote.startLive(
        () => reportData?.selected ? 'reports&election=' + reportData.selected.id : initialRoute,
        initReports));

      /*
       * When your backend is ready, replace loadReports(null) with:
       *
       * fetch('/api/reports')
       *   .then(r => r.json())
       *   .then(data => initReports(data))
       *   .catch(() => initReports(null));
       */
    });
  </script>
</body>

</html>
