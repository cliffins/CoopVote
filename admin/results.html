<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>CoopVote — Results</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --navy: #0b1931;
      --navy2: #0f2040;
      --navy3: #162a52;
      --navy4: #1e3566;
      --gold: #c9a84c;
      --gold2: #e8c96a;
      --white: #ffffff;
      --muted: #7a8ba0;
      --muted2: #a8b8cc;
      --border: rgba(255, 255, 255, .08);
      --danger: #e05c5c;
      --success: #4caf82;
      --warn: #e0a030;
      --info: #4a9fd4;
      --sidebar-w: 260px;
      --header-h: 64px;
      --radius: 14px;
    }

    html,
    body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      overflow: hidden
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .12);
      border-radius: 99px
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes shimmer {

      0%,
      100% {
        left: -70%
      }

      50% {
        left: 140%
      }
    }

    @keyframes sweep {
      0% {
        transform: translateX(-100%)
      }

      100% {
        transform: translateX(300%)
      }
    }

    @keyframes countUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes crownBounce {

      0%,
      100% {
        transform: translateY(0) rotate(-5deg)
      }

      50% {
        transform: translateY(-4px) rotate(-5deg)
      }
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--navy2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      transition: transform .3s cubic-bezier(.22, 1, .36, 1);
      z-index: 200
    }

    .sidebar-logo {
      padding: 28px 22px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(201, 168, 76, .3);
      position: relative;
      overflow: hidden
    }

    .logo-mark::after {
      content: '';
      position: absolute;
      top: 0;
      left: -70%;
      width: 40%;
      height: 100%;
      background: rgba(255, 255, 255, .3);
      transform: skewX(-20deg);
      animation: shimmer 4s ease-in-out infinite
    }

    .logo-mark svg {
      width: 20px;
      height: 20px;
      fill: var(--navy)
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 800
    }

    .logo-text span {
      color: var(--gold)
    }

    .sidebar-section {
      padding: 20px 14px 8px;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 14px;
      margin: 2px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: .875rem;
      font-weight: 500;
      color: var(--muted2);
      transition: all .2s;
      position: relative;
      white-space: nowrap;
      text-decoration: none;
      overflow: hidden
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .06);
      color: var(--white)
    }

    .nav-item.active {
      background: rgba(201, 168, 76, .14);
      color: var(--gold);
      font-weight: 600
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--gold)
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      opacity: .7
    }

    .nav-item.active svg {
      opacity: 1
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0
    }

    .admin-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .05);
      cursor: pointer;
      transition: background .2s
    }

    .admin-card:hover {
      background: rgba(255, 255, 255, .09)
    }

    .admin-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--navy4), var(--navy3));
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      color: var(--gold);
      flex-shrink: 0
    }

    .admin-info {
      flex: 1;
      overflow: hidden
    }

    .admin-name {
      font-size: .82rem;
      font-weight: 600
    }

    .admin-role {
      font-size: .7rem;
      color: var(--muted);
      margin-top: 1px
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0
    }

    .header {
      height: var(--header-h);
      flex-shrink: 0;
      background: rgba(11, 25, 49, .85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
      z-index: 100
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted2);
      padding: 6px;
      border-radius: 8px;
      transition: color .2s, background .2s
    }

    .hamburger:hover {
      color: var(--white);
      background: rgba(255, 255, 255, .07)
    }

    .header-title {
      flex: 1
    }

    .header-title h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700
    }

    .header-title p {
      font-size: .75rem;
      color: var(--muted);
      margin-top: 1px
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .hbtn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, .06);
      color: var(--muted2);
      cursor: pointer;
      transition: all .2s;
      position: relative
    }

    .hbtn:hover {
      background: rgba(255, 255, 255, .12);
      color: var(--white)
    }

    .hbtn svg {
      width: 18px;
      height: 18px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      text-decoration: none
    }

    .btn svg {
      width: 15px;
      height: 15px
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--navy);
      box-shadow: 0 4px 16px rgba(201, 168, 76, .25)
    }

    .btn-gold:hover {
      filter: brightness(1.08);
      transform: translateY(-1px)
    }

    .btn-outline {
      background: rgba(255, 255, 255, .06);
      color: var(--muted2);
      border: 1px solid var(--border)
    }

    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201, 168, 76, .07)
    }

    /* ── CONTENT ── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    /* ── ELECTION SELECTOR ── */
    .election-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      animation: fadeUp .45s cubic-bezier(.22, 1, .36, 1) both
    }

    .el-select {
      padding: 10px 16px;
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      outline: none;
      cursor: pointer;
      transition: border-color .2s;
      min-width: 220px
    }

    .el-select:focus {
      border-color: var(--gold)
    }

    .el-select option {
      background: var(--navy2)
    }

    .el-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: .78rem;
      font-weight: 600
    }

    .el-badge.final {
      background: rgba(76, 175, 130, .12);
      color: var(--success);
      border: 1px solid rgba(76, 175, 130, .2)
    }

    .el-badge.live {
      background: rgba(74, 159, 212, .12);
      color: var(--info);
      border: 1px solid rgba(74, 159, 212, .2)
    }

    .el-badge.draft {
      background: rgba(255, 255, 255, .07);
      color: var(--muted);
      border: 1px solid var(--border)
    }

    .el-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor
    }

    /* ── NO DATA EMPTY ── */
    .page-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 20px;
      animation: fadeUp .5s cubic-bezier(.22, 1, .36, 1) both
    }

    .page-empty svg {
      width: 52px;
      height: 52px;
      opacity: .25
    }

    .page-empty h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--muted2)
    }

    .page-empty p {
      font-size: .84rem;
      line-height: 1.7;
      max-width: 360px
    }

    .page-empty a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--navy);
      font-size: .84rem;
      font-weight: 600;
      text-decoration: none;
      margin-top: 4px;
      transition: filter .2s
    }

    .page-empty a:hover {
      filter: brightness(1.08)
    }

    /* ── SUMMARY STRIP ── */
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      animation: fadeUp .45s .05s cubic-bezier(.22, 1, .36, 1) both
    }

    .s-card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform .2s;
      cursor: default
    }

    .s-card:hover {
      transform: translateY(-2px)
    }

    .s-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .s-icon svg {
      width: 19px;
      height: 19px
    }

    .s-icon.gold {
      background: rgba(201, 168, 76, .15)
    }

    .s-icon.gold svg {
      color: var(--gold)
    }

    .s-icon.green {
      background: rgba(76, 175, 130, .15)
    }

    .s-icon.green svg {
      color: var(--success)
    }

    .s-icon.blue {
      background: rgba(74, 159, 212, .15)
    }

    .s-icon.blue svg {
      color: var(--info)
    }

    .s-icon.purple {
      background: rgba(155, 127, 212, .15)
    }

    .s-icon.purple svg {
      color: #9b7fd4
    }

    .s-val {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1;
      color: var(--white)
    }

    .s-val.empty {
      color: var(--muted);
      font-size: 1.3rem
    }

    .s-label {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 3px
    }

    /* ── POSITION TABS ── */
    .pos-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      animation: fadeUp .45s .1s cubic-bezier(.22, 1, .36, 1) both
    }

    .pos-tab {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      font-weight: 500;
      color: var(--muted2);
      transition: all .2s
    }

    .pos-tab:hover {
      border-color: rgba(255, 255, 255, .2);
      color: var(--white)
    }

    .pos-tab.active {
      font-weight: 700;
      color: var(--navy);
      border-color: transparent
    }

    /* ── RESULTS MAIN LAYOUT ── */
    .results-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      animation: fadeUp .45s .14s cubic-bezier(.22, 1, .36, 1) both
    }

    /* ── WINNER HERO CARD ── */
    .winner-card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      position: relative;
      overflow: hidden
    }

    .winner-card::before {
      content: '';
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 168, 76, .12), transparent 70%);
      pointer-events: none
    }

    .winner-crown {
      font-size: 1.6rem;
      margin-bottom: 8px;
      display: block;
      animation: crownBounce 2s ease-in-out infinite
    }

    .winner-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      border: 3px solid var(--gold);
      box-shadow: 0 0 0 6px rgba(201, 168, 76, .15);
      overflow: hidden
    }

    .winner-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .winner-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 4px
    }

    .winner-pos {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: .75rem;
      font-weight: 700;
      margin-bottom: 16px
    }

    .winner-votes {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1
    }

    .winner-votes-label {
      font-size: .75rem;
      color: var(--muted);
      margin-top: 4px
    }

    .winner-pct {
      display: inline-block;
      background: rgba(201, 168, 76, .12);
      border: 1px solid rgba(201, 168, 76, .2);
      color: var(--gold);
      font-size: .8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 8px;
      margin-top: 10px
    }

    .winner-divider {
      height: 1px;
      background: var(--border);
      margin: 18px 0
    }

    /* ── CANDIDATE BARS ── */
    .cand-bars {
      display: flex;
      flex-direction: column;
      gap: 0
    }

    .cand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .04);
      transition: background .15s;
      padding: 14px
    }

    .cand-row:hover {
      background: rgba(255, 255, 255, .03);
      border-radius: 10px
    }

    .cand-row:last-child {
      border-bottom: none
    }

    .cand-rank {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      flex-shrink: 0
    }

    .rank-1 {
      background: rgba(201, 168, 76, .2);
      color: var(--gold);
      border: 1px solid rgba(201, 168, 76, .4)
    }

    .rank-2 {
      background: rgba(255, 255, 255, .1);
      color: var(--muted2)
    }

    .rank-3 {
      background: rgba(205, 127, 50, .15);
      color: #cd7f32
    }

    .rank-n {
      background: rgba(255, 255, 255, .06);
      color: var(--muted)
    }

    .cand-avatar-sm {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden
    }

    .cand-avatar-sm img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .cand-info {
      flex: 1;
      min-width: 0
    }

    .cand-name-sm {
      font-size: .88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .cand-occ-sm {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 2px
    }

    .cand-bar-wrap {
      flex: 2;
      min-width: 0
    }

    .cand-bar-track {
      height: 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .07);
      overflow: hidden;
      margin-bottom: 4px
    }

    .cand-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 1.2s cubic-bezier(.22, 1, .36, 1);
      position: relative;
      overflow: hidden
    }

    .cand-bar-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .2), transparent);
      animation: sweep 3s ease-in-out infinite
    }

    .cand-bar-fill.winner-fill {
      background: linear-gradient(90deg, var(--gold), var(--gold2))
    }

    .cand-pct-row {
      display: flex;
      justify-content: space-between;
      font-size: .7rem;
      color: var(--muted)
    }

    .cand-votes-count {
      font-weight: 600;
      color: var(--muted2)
    }

    /* ── TURNOUT PANEL ── */
    .turnout-panel {
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden
    }

    .card-head {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 10px
    }

    .card-title {
      font-size: .9rem;
      font-weight: 600
    }

    .card-sub {
      font-size: .74rem;
      color: var(--muted);
      margin-top: 2px
    }

    .card-body {
      padding: 18px 20px
    }

    /* turnout donut */
    .donut-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px
    }

    .donut-svg-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      flex-shrink: 0
    }

    .donut-svg-wrap svg {
      transform: rotate(-90deg)
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center
    }

    .donut-pct {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold)
    }

    .donut-sub {
      font-size: .63rem;
      color: var(--muted);
      margin-top: 2px
    }

    .donut-legend {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .leg-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .8rem
    }

    .leg-left {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted2)
    }

    .leg-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .leg-val {
      font-weight: 600;
      color: var(--white)
    }

    /* stats in panel */
    .panel-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .04);
      font-size: .82rem
    }

    .panel-stat-row:last-child {
      border-bottom: none
    }

    .panel-stat-label {
      color: var(--muted)
    }

    .panel-stat-val {
      font-weight: 600;
      color: var(--muted2)
    }

    .panel-stat-val.gold {
      color: var(--gold)
    }

    .panel-stat-val.green {
      color: var(--success)
    }

    /* winners summary list */
    .winners-list {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .winner-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(201, 168, 76, .05);
      border: 1px solid rgba(201, 168, 76, .12);
      border-radius: 10px;
      transition: background .2s
    }

    .winner-mini:hover {
      background: rgba(201, 168, 76, .1)
    }

    .wm-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .68rem;
      font-weight: 700;
      flex-shrink: 0;
      border: 1.5px solid rgba(201, 168, 76, .3);
      overflow: hidden
    }

    .wm-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .wm-info {
      flex: 1;
      min-width: 0
    }

    .wm-name {
      font-size: .82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .wm-pos {
      font-size: .7rem;
      color: var(--muted);
      margin-top: 1px
    }

    .wm-votes {
      font-family: 'Playfair Display', serif;
      font-size: .9rem;
      font-weight: 700;
      color: var(--gold);
      flex-shrink: 0
    }

    /* ── EMPTY STATES ── */
    .empty-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 44px 20px;
      gap: 10px;
      color: var(--muted);
      text-align: center
    }

    .empty-section svg {
      width: 36px;
      height: 36px;
      opacity: .28
    }

    .empty-section p {
      font-size: .82rem;
      line-height: 1.6
    }

    /* ── OVERLAY ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      z-index: 150;
      backdrop-filter: blur(4px)
    }

    /* ── RESPONSIVE ── */
    @media(max-width:1100px) {
      .results-layout {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:900px) {
      .summary-strip {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: 8px 0 40px rgba(0, 0, 0, .5)
      }

      .sidebar.open {
        transform: translateX(0)
      }

      .overlay {
        display: block;
        pointer-events: none;
        opacity: 0;
        transition: opacity .3s
      }

      .overlay.show {
        pointer-events: all;
        opacity: 1
      }

      .hamburger {
        display: flex
      }

      .content {
        padding: 16px
      }

      .header {
        padding: 0 16px
      }
    }

    @media(max-width:480px) {
      .summary-strip {
        grid-template-columns: 1fr 1fr
      }

      .s-val {
        font-size: 1.4rem
      }
    }

    /* ── Layout fix ──────────────────────────────────────────
       .content is a flex column, and flex items shrink by default.
       Once the page grew taller than the viewport every section was
       squashed, and any card with overflow:hidden clipped its own
       text (the welcome hero showed the name but hid the meta line).
       Sections keep their natural height; .content already scrolls. */
    .content>* {
      flex-shrink: 0;
    }

    /* ── Empty-state action icons ────────────────────────────
       The illustration rule above (.page-empty svg and friends) also
       matches the icon inside the empty state's button, and a rule
       beats the svg's own width/height attributes. Keep those icons
       button-sized so the call to action matches every other button. */
    .page-empty a svg,
    .page-empty button svg,
    .empty-section a svg,
    .empty-section button svg,
    .page-state a svg,
    .page-state button svg,
    .hero-empty a svg,
    .hero-empty button svg {
      width: 14px;
      height: 14px;
      opacity: 1;
    }
  </style>

  <script>
    /* ─────────────────────────────────────────
       STATE
    ───────────────────────────────────────── */
    let resultsData = null;   // set by initResults(data)
    let activeElIdx = 0;      // selected election index
    let activePosIdx = 0;      // selected position tab index

    const POS_COLORS = ['#c9a84c', '#4a9fd4', '#4caf82', '#9b7fd4', '#e0a030', '#e05c5c'];
    const AVATAR_PALETTE = [
      { bg: '#1e2d5a', fg: '#7ca4e8' }, { bg: '#1a3a2e', fg: '#5dc99a' },
      { bg: '#3a1e1e', fg: '#e87c7c' }, { bg: '#3a2e10', fg: '#d4a84c' },
      { bg: '#2a1e3a', fg: '#b07cd4' }, { bg: '#1a2e3a', fg: '#5cb8d4' },
    ];

    /* ─────────────────────────────────────────
       SIDEBAR
    ───────────────────────────────────────── */
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }

    /* ─────────────────────────────────────────
       LOAD RESULTS
       ─────────────────────────────────────────
       Replace with real API:
       fetch('/api/results')
         .then(r => r.json())
         .then(data => initResults(data))
         .catch(() => initResults(null));
    
       Expected shape:
       {
         elections: [
           {
             id, title, status,            // status: Final | Live | Draft
             totalVoters, votesCast,
             startDate, endDate,
             positions: [
               {
                 name,
                 candidates: [
                   {
                     id, first, last, occ,
                     votes, photoUrl        // photoUrl optional
                   }
                 ]
               }
             ]
           }
         ]
       }
    ───────────────────────────────────────── */
    function loadResults() {
      CoopVote.api('results')
        .then(data => initResults(data))
        .catch(err => {
          initResults(null);
          CoopVote.toast(err.message || 'Could not load data from the server.', 'error');
        });
    }

    function initResults(data) {
      resultsData = data;
      activeElIdx = 0;
      activePosIdx = 0;
      renderPage();
    }

    /* ─────────────────────────────────────────
       HELPERS
    ───────────────────────────────────────── */
    function initials(first, last) {
      return ((first?.[0] || '') + (last?.[0] || '')).toUpperCase() || '?';
    }
    function avatarColor(id) {
      return AVATAR_PALETTE[(typeof id === 'number' ? id : 0) % AVATAR_PALETTE.length];
    }
    function posColor(idx) { return POS_COLORS[idx % POS_COLORS.length]; }
    function avatarEl(c, size = 38, initClass = '') {
      const { bg, fg } = avatarColor(c.id || 0);
      const style = `width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:${Math.round(size * .35)}px;font-weight:700;flex-shrink:0;overflow:hidden;background:${bg};color:${fg}`;
      if (c.photoUrl) return `<div style="${style}"><img src="${esc(c.photoUrl)}" style="width:100%;height:100%;object-fit:cover" alt="${esc(c.first)}"/></div>`;
      return `<div style="${style}" ${initClass}>${initials(c.first, c.last)}</div>`;
    }

    /* ─────────────────────────────────────────
       RENDER PAGE
    ───────────────────────────────────────── */
    function renderPage() {
      const container = document.getElementById('main-content');

      if (!resultsData || !resultsData.elections || resultsData.elections.length === 0) {
        container.innerHTML = `
      <div class="page-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <h2>No Results Available</h2>
        <p>Election results will appear here once an election has been completed or is currently in progress.</p>
        <a href="election-management.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Go to Election Management
        </a>
      </div>`;
        return;
      }

      const elections = resultsData.elections;
      const el = elections[activeElIdx];
      const pct = el.totalVoters > 0 ? Math.round((el.votesCast / el.totalVoters) * 100) : 0;
      const remaining = Math.max(0, el.totalVoters - el.votesCast);
      const positions = el.positions || [];
      const allWinners = positions.map(p => p.candidates ? [...p.candidates].sort((a, b) => (b.votes || 0) - (a.votes || 0))[0] : null).filter(Boolean);

      const statusBadgeHTML = el.status === 'Final'
        ? `<span class="el-badge final">Final Results</span>`
        : el.status === 'Live'
          ? `<span class="el-badge live">Live — In Progress</span>`
          : `<span class="el-badge draft">Not Published</span>`;

      /* ── Election Selector ── */
      const selectorHTML = `
    <div class="election-selector">
      <select class="el-select" onchange="switchElection(this.value)">
        ${elections.map((e, i) => `<option value="${i}" ${i === activeElIdx ? 'selected' : ''}>${esc(e.title)}</option>`).join('')}
      </select>
      ${statusBadgeHTML}
      <div style="margin-left:auto;display:flex;gap:8px">
        <a href="reports.html?election=${Number(el.id)}" class="btn btn-outline" style="padding:8px 14px;font-size:.8rem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Print / PDF
        </a>
      </div>
    </div>`;

      /* ── Summary Strip ── */
      const summaryHTML = `
    <div class="summary-strip">
      <div class="s-card">
        <div class="s-icon gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        <div><div class="s-val">${(el.totalVoters || 0).toLocaleString()}</div><div class="s-label">Registered Voters</div></div>
      </div>
      <div class="s-card">
        <div class="s-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
        <div><div class="s-val">${(el.votesCast || 0).toLocaleString()}</div><div class="s-label">Total Votes Cast</div></div>
      </div>
      <div class="s-card">
        <div class="s-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
        <div><div class="s-val">${positions.length}</div><div class="s-label">Positions Contested</div></div>
      </div>
      <div class="s-card">
        <div class="s-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
        <div><div class="s-val">${pct}%</div><div class="s-label">Voter Turnout</div></div>
      </div>
    </div>`;

      /* ── Position Tabs ── */
      const tabsHTML = positions.length > 0 ? `
    <div class="pos-tabs">
      ${positions.map((p, i) => `
        <button class="pos-tab${i === activePosIdx ? ' active' : ''}"
          style="${i === activePosIdx ? `background:${posColor(i)};border-color:${posColor(i)};` : ''}"
          onclick="switchPos(${i})">${esc(p.name)}</button>`).join('')}
    </div>` : '';

      /* ── Results Layout ── */
      container.innerHTML = selectorHTML + summaryHTML + tabsHTML + `<div id="results-body"></div>`;

      if (positions.length > 0) renderResultsBody();
      else {
        document.getElementById('results-body').innerHTML = `
      <div class="page-empty" style="padding:40px 20px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <p style="font-size:.84rem">No position data for this election.</p>
      </div>`;
      }
    }

    /* ─────────────────────────────────────────
       RENDER RESULTS BODY (for active position)
    ───────────────────────────────────────── */
    function renderResultsBody() {
      const el = resultsData.elections[activeElIdx];
      const positions = el.positions || [];
      const pct = el.totalVoters > 0 ? Math.round((el.votesCast / el.totalVoters) * 100) : 0;
      const remaining = Math.max(0, el.totalVoters - el.votesCast);
      const pos = positions[activePosIdx];
      const pColor = posColor(activePosIdx);
      const allWinners = positions.map(p => p.candidates ? [...p.candidates].sort((a, b) => (b.votes || 0) - (a.votes || 0))[0] : null).filter(Boolean);

      if (!pos) { document.getElementById('results-body').innerHTML = ''; return; }

      const cands = [...(pos.candidates || [])].sort((a, b) => (b.votes || 0) - (a.votes || 0));
      const winner = cands[0];
      const total = cands.reduce((s, c) => s + (c.votes || 0), 0) || 1;
      const { bg, fg } = winner ? avatarColor(winner.id || 0) : { bg: '#1e2d5a', fg: '#7ca4e8' };

      const winnerHTML = winner ? `
    <div class="winner-card">
      <span class="winner-crown">👑</span>
      ${winner.photoUrl
          ? `<div class="winner-avatar" style="border-color:${pColor};box-shadow:0 0 0 6px ${pColor}22"><img src="${esc(winner.photoUrl)}" alt="${esc(winner.first)}" style="width:100%;height:100%;object-fit:cover"/></div>`
          : `<div class="winner-avatar" style="background:${bg};color:${fg};border-color:${pColor};box-shadow:0 0 0 6px ${pColor}22">${initials(winner.first, winner.last)}</div>`}
      <div class="winner-name">${esc(winner.first)} ${esc(winner.last)}</div>
      <div class="winner-pos" style="background:${pColor}22;color:${pColor};border:1px solid ${pColor}44">${esc(pos.name)}</div>
      <div class="winner-votes">${(winner.votes || 0).toLocaleString()}</div>
      <div class="winner-votes-label">votes received</div>
      <div class="winner-pct">${Math.round((winner.votes || 0) / total * 100)}% of position votes</div>
      <div class="winner-divider"></div>
      <div style="font-size:.75rem;color:var(--muted);margin-bottom:6px;text-align:left">Occupation</div>
      <div style="font-size:.85rem;font-weight:500;text-align:left">${esc(winner.occ || '—')}</div>
    </div>` : `<div class="page-empty" style="padding:32px"><p>No candidates for this position.</p></div>`;

      const candsHTML = cands.length > 0 ? `
    <div class="card" style="animation-delay:.1s">
      <div class="card-head">
        <div>
          <div class="card-title">All Candidates — ${esc(pos.name)}</div>
          <div class="card-sub">${cands.length} candidate${cands.length !== 1 ? 's' : ''} · ${total.toLocaleString()} votes total</div>
        </div>
      </div>
      <div class="cand-bars">
        ${cands.map((c, i) => {
        const barW = Math.round((c.votes || 0) / total * 100);
        const rankCls = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-n';
        const { bg: abg, fg: afg } = avatarColor(c.id || 0);
        return `<div class="cand-row">
            <div class="cand-rank ${rankCls}">${i + 1}</div>
            <div class="cand-avatar-sm" style="background:${abg};color:${afg}">
              ${c.photoUrl ? `<img src="${esc(c.photoUrl)}" alt="${esc(c.first)}" style="width:100%;height:100%;object-fit:cover"/>` : `${initials(c.first, c.last)}`}
            </div>
            <div class="cand-info">
              <div class="cand-name-sm">${esc(c.first)} ${esc(c.last)}</div>
              <div class="cand-occ-sm">${esc(c.occ || '—')}</div>
            </div>
            <div class="cand-bar-wrap">
              <div class="cand-bar-track">
                <div class="cand-bar-fill${i === 0 ? ' winner-fill' : ''}" data-w="${barW}%"
                  style="width:0%;${i !== 0 ? `background:linear-gradient(90deg,${pColor}88,${pColor}44)` : ''}"></div>
              </div>
              <div class="cand-pct-row">
                <span>${barW}%</span>
                <span class="cand-votes-count">${(c.votes || 0).toLocaleString()} votes</span>
              </div>
            </div>
          </div>`;
      }).join('')}
      </div>
    </div>` : '';

      const donutPct = pct;
      const circ = 226.2; // 2π × 36

      const sideHTML = `
    <div class="turnout-panel">
      <!-- Turnout Donut -->
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">Voter Turnout</div><div class="card-sub">${esc(el.title)}</div></div>
        </div>
        <div class="card-body">
          <div class="donut-wrap">
            <div class="donut-svg-wrap">
              <svg width="120" height="120" viewBox="0 0 120 120">
                <defs><linearGradient id="dg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4caf82"/><stop offset="100%" stop-color="#7be8b4"/></linearGradient></defs>
                <circle cx="60" cy="60" r="36" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="14"/>
                <circle cx="60" cy="60" r="36" fill="none" stroke="url(#dg2)" stroke-width="14"
                  stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="dt-arc" stroke-linecap="round"/>
              </svg>
              <div class="donut-center"><div class="donut-pct">${donutPct}%</div><div class="donut-sub">Turnout</div></div>
            </div>
            <div class="donut-legend">
              <div class="leg-item"><div class="leg-left"><div class="leg-dot" style="background:var(--success)"></div>Voted</div><div class="leg-val">${(el.votesCast || 0).toLocaleString()}</div></div>
              <div class="leg-item"><div class="leg-left"><div class="leg-dot" style="background:rgba(74,159,212,.4)"></div>Not Voted</div><div class="leg-val">${remaining.toLocaleString()}</div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Election Summary -->
      <div class="card">
        <div class="card-head"><div><div class="card-title">Election Summary</div></div></div>
        <div class="card-body">
          <div class="panel-stat-row"><span class="panel-stat-label">Election</span><span class="panel-stat-val" style="font-size:.78rem;text-align:right;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(el.title)}</span></div>
          <div class="panel-stat-row"><span class="panel-stat-label">Period</span><span class="panel-stat-val" style="font-size:.78rem">${el.startDate || '—'} – ${el.endDate || '—'}</span></div>
          <div class="panel-stat-row"><span class="panel-stat-label">Positions</span><span class="panel-stat-val">${positions.length}</span></div>
          <div class="panel-stat-row"><span class="panel-stat-label">Turnout</span><span class="panel-stat-val gold">${donutPct}%</span></div>
          <div class="panel-stat-row" style="border-bottom:none"><span class="panel-stat-label">Status</span><span class="panel-stat-val green">${el.status || '—'}</span></div>
        </div>
      </div>

      <!-- All Winners -->
      ${allWinners.length > 0 ? `
      <div class="card">
        <div class="card-head"><div><div class="card-title">Winners Summary</div><div class="card-sub">One winner per position</div></div></div>
        <div class="card-body">
          <div class="winners-list">
            ${allWinners.map((w, i) => {
        const { bg: wb, fg: wf } = avatarColor(w.id || 0);
        const wColor = posColor(i);
        return `<div class="winner-mini">
                <div class="wm-avatar" style="background:${wb};color:${wf};border-color:${wColor}44">
                  ${w.photoUrl ? `<img src="${esc(w.photoUrl)}" alt="${esc(w.first)}" style="width:100%;height:100%;object-fit:cover"/>` : `${initials(w.first, w.last)}`}
                </div>
                <div class="wm-info">
                  <div class="wm-name">${esc(w.first)} ${esc(w.last)}</div>
                  <div class="wm-pos" style="color:${wColor}">${positions[i]?.name || '—'}</div>
                </div>
                <div class="wm-votes" style="color:${wColor}">${(w.votes || 0).toLocaleString()}</div>
              </div>`;
      }).join('')}
          </div>
        </div>
      </div>` : ''}
    </div>`;

      document.getElementById('results-body').innerHTML = `
    <div class="results-layout">
      <div class="results-primary">
        ${winnerHTML}
        ${candsHTML}
      </div>
      ${sideHTML}
    </div>`;

      // animate bars
      setTimeout(() => {
        document.querySelectorAll('.cand-bar-fill[data-w]').forEach((b, i) => {
          b.style.transition = `width 1.1s ${i * .07}s cubic-bezier(.22,1,.36,1)`;
          b.style.width = b.dataset.w;
        });
        const arc = document.getElementById('dt-arc');
        if (arc) {
          arc.style.transition = 'stroke-dashoffset 1.4s .2s cubic-bezier(.22,1,.36,1)';
          arc.style.strokeDashoffset = circ * (1 - donutPct / 100);
        }
      }, 200);
    }

    /* ─────────────────────────────────────────
       SWITCH HANDLERS
    ───────────────────────────────────────── */
    function switchElection(idx) {
      activeElIdx = parseInt(idx);
      activePosIdx = 0;
      renderPage();
    }

    function switchPos(idx) {
      activePosIdx = idx;
      // update tab active states
      document.querySelectorAll('.pos-tab').forEach((t, i) => {
        const active = i === idx;
        t.classList.toggle('active', active);
        if (active) { t.style.background = posColor(idx); t.style.borderColor = posColor(idx); t.style.color = 'var(--navy)'; }
        else { t.style.background = ''; t.style.borderColor = ''; t.style.color = ''; }
      });
      renderResultsBody();
    }

    /* ─────────────────────────────────────────
       INIT
    ───────────────────────────────────────── */
    window.addEventListener('DOMContentLoaded', () => {
      CoopVote.guard('admin').then(loadResults);

      /*
       * When your backend is ready, replace loadResults() with:
       *
       * fetch('/api/results')
       *   .then(r => r.json())
       *   .then(data => initResults(data))
       *   .catch(() => initResults(null));
       */
    });
  </script>
</body>

</html>
