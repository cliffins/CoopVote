<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>CoopVote — Vote Monitoring</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --navy: #0b1931;
      --navy2: #0f2040;
      --navy3: #162a52;
      --navy4: #1e3566;
      --gold: #c9a84c;
      --gold2: #e8c96a;
      --white: #ffffff;
      --muted: #7a8ba0;
      --muted2: #a8b8cc;
      --border: rgba(255, 255, 255, .08);
      --danger: #e05c5c;
      --success: #4caf82;
      --warn: #e0a030;
      --info: #4a9fd4;
      --sidebar-w: 260px;
      --header-h: 64px;
      --radius: 14px;
    }

    html,
    body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      overflow: hidden
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .12);
      border-radius: 99px
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes shimmer {

      0%,
      100% {
        left: -70%
      }

      50% {
        left: 140%
      }
    }

    @keyframes pulseLive {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(76, 175, 130, .5)
      }

      50% {
        box-shadow: 0 0 0 8px rgba(76, 175, 130, 0)
      }
    }

    @keyframes sweep {
      0% {
        transform: translateX(-100%)
      }

      100% {
        transform: translateX(300%)
      }
    }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--navy2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      transition: transform .3s cubic-bezier(.22, 1, .36, 1);
      z-index: 200
    }

    .sidebar-logo {
      padding: 28px 22px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(201, 168, 76, .3);
      position: relative;
      overflow: hidden
    }

    .logo-mark::after {
      content: '';
      position: absolute;
      top: 0;
      left: -70%;
      width: 40%;
      height: 100%;
      background: rgba(255, 255, 255, .3);
      transform: skewX(-20deg);
      animation: shimmer 4s ease-in-out infinite
    }

    .logo-mark svg {
      width: 20px;
      height: 20px;
      fill: var(--navy)
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 800
    }

    .logo-text span {
      color: var(--gold)
    }

    .sidebar-section {
      padding: 20px 14px 8px;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 14px;
      margin: 2px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: .875rem;
      font-weight: 500;
      color: var(--muted2);
      transition: all .2s;
      position: relative;
      white-space: nowrap;
      text-decoration: none;
      overflow: hidden
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .06);
      color: var(--white)
    }

    .nav-item.active {
      background: rgba(201, 168, 76, .14);
      color: var(--gold);
      font-weight: 600
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--gold)
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      opacity: .7
    }

    .nav-item.active svg {
      opacity: 1
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0
    }

    .admin-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .05);
      cursor: pointer;
      transition: background .2s
    }

    .admin-card:hover {
      background: rgba(255, 255, 255, .09)
    }

    .admin-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--navy4), var(--navy3));
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      color: var(--gold);
      flex-shrink: 0
    }

    .admin-info {
      flex: 1;
      overflow: hidden
    }

    .admin-name {
      font-size: .82rem;
      font-weight: 600
    }

    .admin-role {
      font-size: .7rem;
      color: var(--muted);
      margin-top: 1px
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0
    }

    .header {
      height: var(--header-h);
      flex-shrink: 0;
      background: rgba(11, 25, 49, .85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
      z-index: 100
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted2);
      padding: 6px;
      border-radius: 8px;
      transition: color .2s, background .2s
    }

    .hamburger:hover {
      color: var(--white);
      background: rgba(255, 255, 255, .07)
    }

    .header-title {
      flex: 1
    }

    .header-title h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700
    }

    .header-title p {
      font-size: .75rem;
      color: var(--muted);
      margin-top: 1px
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .hbtn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, .06);
      color: var(--muted2);
      cursor: pointer;
      transition: all .2s;
      position: relative
    }

    .hbtn:hover {
      background: rgba(255, 255, 255, .12);
      color: var(--white)
    }

    .hbtn svg {
      width: 18px;
      height: 18px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      text-decoration: none
    }

    .btn svg {
      width: 15px;
      height: 15px
    }

    .btn-outline {
      background: rgba(255, 255, 255, .06);
      color: var(--muted2);
      border: 1px solid var(--border)
    }

    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201, 168, 76, .07)
    }

    /* CONTENT */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    /* LIVE BADGE */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(76, 175, 130, .15);
      border: 1px solid rgba(76, 175, 130, .3);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .8px;
      color: var(--success)
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      animation: pulseLive 1.5s ease-in-out infinite
    }

    /* NO ELECTION STATE */
    .page-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 20px;
      animation: fadeUp .5s cubic-bezier(.22, 1, .36, 1) both
    }

    .page-empty svg {
      width: 52px;
      height: 52px;
      opacity: .25
    }

    .page-empty h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--muted2)
    }

    .page-empty p {
      font-size: .84rem;
      line-height: 1.7;
      max-width: 360px
    }

    .page-empty a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--navy);
      font-size: .84rem;
      font-weight: 600;
      text-decoration: none;
      transition: filter .2s;
      margin-top: 4px
    }

    .page-empty a:hover {
      filter: brightness(1.08)
    }

    /* STATS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      animation: fadeUp .5s cubic-bezier(.22, 1, .36, 1) both
    }

    .stat-card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: transform .2s;
      cursor: default
    }

    .stat-card:hover {
      transform: translateY(-2px)
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: -20px;
      right: -20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      opacity: .1
    }

    .stat-card.gold::after {
      background: var(--gold)
    }

    .stat-card.green::after {
      background: var(--success)
    }

    .stat-card.blue::after {
      background: var(--info)
    }

    .stat-card.purple::after {
      background: #9b7fd4
    }

    .sc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px
    }

    .sc-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .sc-icon svg {
      width: 18px;
      height: 18px
    }

    .sc-icon.gold {
      background: rgba(201, 168, 76, .15)
    }

    .sc-icon.gold svg {
      color: var(--gold)
    }

    .sc-icon.green {
      background: rgba(76, 175, 130, .15)
    }

    .sc-icon.green svg {
      color: var(--success)
    }

    .sc-icon.blue {
      background: rgba(74, 159, 212, .15)
    }

    .sc-icon.blue svg {
      color: var(--info)
    }

    .sc-icon.purple {
      background: rgba(155, 127, 212, .15)
    }

    .sc-icon.purple svg {
      color: #9b7fd4
    }

    .sc-badge {
      font-size: .7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px
    }

    .sc-badge.live {
      background: rgba(76, 175, 130, .15);
      color: var(--success)
    }

    .sc-badge.neutral {
      background: rgba(255, 255, 255, .07);
      color: var(--muted)
    }

    .sc-val {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 3px
    }

    .sc-label {
      font-size: .74rem;
      color: var(--muted)
    }

    .sc-bar {
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .07);
      overflow: hidden;
      margin-top: 10px
    }

    .sc-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 1.3s cubic-bezier(.22, 1, .36, 1);
      width: 0%;
      position: relative;
      overflow: hidden
    }

    .sc-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .25), transparent);
      animation: sweep 2.5s ease-in-out infinite
    }

    .sc-fill.gold {
      background: linear-gradient(90deg, var(--gold), var(--gold2))
    }

    .sc-fill.green {
      background: linear-gradient(90deg, #27ae60, var(--success))
    }

    .sc-fill.blue {
      background: linear-gradient(90deg, #2980b9, var(--info))
    }

    .sc-fill.purple {
      background: linear-gradient(90deg, #7c5cbf, #9b7fd4)
    }

    /* TWO COL */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px
    }

    /* CARD */
    .card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeUp .5s .1s cubic-bezier(.22, 1, .36, 1) both
    }

    .card-head {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap
    }

    .card-title {
      font-size: .9rem;
      font-weight: 600
    }

    .card-sub {
      font-size: .74rem;
      color: var(--muted);
      margin-top: 2px
    }

    .card-body {
      padding: 20px
    }

    /* POSITION BARS */
    .pos-list {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .pos-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px
    }

    .pos-name {
      font-size: .85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .pos-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .pos-count {
      font-family: 'Playfair Display', serif;
      font-size: .95rem;
      font-weight: 700
    }

    .pos-track {
      height: 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .07);
      overflow: hidden
    }

    .pos-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 1.2s cubic-bezier(.22, 1, .36, 1);
      position: relative;
      overflow: hidden
    }

    .pos-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .2), transparent);
      animation: sweep 3s ease-in-out infinite
    }

    .pos-pct {
      font-size: .7rem;
      color: var(--muted);
      margin-top: 4px;
      text-align: right
    }

    /* DONUT */
    .donut-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 4px 0
    }

    .donut-svg-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      flex-shrink: 0
    }

    .donut-svg-wrap svg {
      transform: rotate(-90deg)
    }

    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center
    }

    .donut-pct {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold)
    }

    .donut-sub {
      font-size: .65rem;
      color: var(--muted);
      margin-top: 2px
    }

    .donut-legend {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .8rem
    }

    .legend-left {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted2)
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .legend-val {
      font-weight: 600;
      color: var(--white)
    }

    /* BOTTOM GRID */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    /* TABLE */
    .table-card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeUp .5s .18s cubic-bezier(.22, 1, .36, 1) both
    }

    .table-head {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 8px
    }

    .table-scroll {
      overflow-x: auto
    }

    .recent-votes-card { display: flex; flex-direction: column; height: clamp(360px, 60vh, 620px); }
    .recent-votes-card .table-scroll { flex: 1; min-height: 0; overflow: auto; }
    .recent-votes-card thead { position: sticky; top: 0; z-index: 1; background: var(--navy2); }
    .recent-votes-card .pagination { margin-top: auto; flex-shrink: 0; background: var(--navy2); }
    .row-number { color: var(--muted2); font-variant-numeric: tabular-nums; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .83rem;
      min-width: 480px
    }

    thead tr {
      background: rgba(255, 255, 255, .03);
      border-bottom: 1px solid var(--border)
    }

    th {
      padding: 11px 16px;
      text-align: left;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .04);
      vertical-align: middle;
      transition: background .15s
    }

    tr:hover td {
      background: rgba(255, 255, 255, .03)
    }

    tr:last-child td {
      border-bottom: none
    }

    .mono {
      font-family: monospace;
      font-size: .75rem
    }

    .voter-cell {
      display: flex;
      align-items: center;
      gap: 9px
    }

    .v-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .65rem;
      font-weight: 700;
      flex-shrink: 0
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: .69rem;
      font-weight: 700;
      white-space: nowrap
    }

    .badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor
    }

    .badge-green {
      background: rgba(76, 175, 130, .15);
      color: var(--success)
    }

    /* FEED */
    .feed-list {
      display: flex;
      flex-direction: column
    }

    .feed-item {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .04);
      transition: background .15s
    }

    .feed-item:hover {
      background: rgba(255, 255, 255, .03)
    }

    .feed-item:last-child {
      border-bottom: none
    }

    .feed-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px
    }

    .feed-dot.vote {
      background: var(--success)
    }

    .feed-dot.auth {
      background: var(--info)
    }

    .feed-dot.warn {
      background: var(--warn)
    }

    .feed-dot.sys {
      background: var(--gold)
    }

    .feed-info {
      flex: 1;
      min-width: 0
    }

    .feed-title {
      font-size: .82rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .feed-time {
      font-size: .7rem;
      color: var(--muted);
      margin-top: 2px
    }

    /* EMPTY */
    .empty-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 10px;
      color: var(--muted);
      text-align: center
    }

    .empty-section svg {
      width: 34px;
      height: 34px;
      opacity: .28
    }

    .empty-section p {
      font-size: .82rem
    }

    /* PAGINATION */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 8px
    }

    .pag-info {
      font-size: .76rem;
      color: var(--muted)
    }

    .pag-btns {
      display: flex;
      flex-wrap: wrap;
      min-width: 0;
      max-width: 100%;
      gap: 5px
    }

    .pag-info, .pag-btn { font-variant-numeric: tabular-nums; }
    .pag-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    @media (max-width: 480px) {
      .pag-btns { gap: 3px; }
      .pagination .pag-btn { width: clamp(24px, 6.8vw, 28px); flex-shrink: 0; }
    }

    .pag-btn {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted2);
      cursor: pointer;
      font-size: .78rem;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif
    }

    .pag-btn:hover {
      border-color: var(--gold);
      color: var(--gold)
    }

    .pag-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy);
      font-weight: 700
    }

    .pag-btn:disabled {
      opacity: .35;
      cursor: not-allowed
    }

    /* OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      z-index: 150;
      backdrop-filter: blur(4px)
    }

    /* RESPONSIVE */
    @media(max-width:1100px) {
      .two-col {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:900px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .bottom-grid {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: 8px 0 40px rgba(0, 0, 0, .5)
      }

      .sidebar.open {
        transform: translateX(0)
      }

      .overlay {
        display: block;
        pointer-events: none;
        opacity: 0;
        transition: opacity .3s
      }

      .overlay.show {
        pointer-events: all;
        opacity: 1
      }

      .hamburger {
        display: flex
      }

      .content {
        padding: 16px
      }

      .header {
        padding: 0 16px
      }
    }

    @media(max-width:480px) {
      .stats-grid {
        grid-template-columns: 1fr 1fr
      }
    }
  
    /* ── Layout fix ──────────────────────────────────────────
       .content is a flex column, and flex items shrink by default.
       Once the page grew taller than the viewport every section was
       squashed, and any card with overflow:hidden clipped its own
       text (the welcome hero showed the name but hid the meta line).
       Sections keep their natural height; .content already scrolls. */
    .content > * { flex-shrink: 0; }

    /* ── Empty-state action icons ────────────────────────────
       The illustration rule above (.page-empty svg and friends) also
       matches the icon inside the empty state's button, and a rule
       beats the svg's own width/height attributes. Keep those icons
       button-sized so the call to action matches every other button. */
    .page-empty a svg, .page-empty button svg,
    .empty-section a svg, .empty-section button svg,
    .page-state a svg, .page-state button svg,
    .hero-empty a svg, .hero-empty button svg {
      width: 14px;
      height: 14px;
      opacity: 1;
    }
  </style>

  <script>
    let monitorData = null;
    const POS_COLORS = ['#c9a84c', '#4a9fd4', '#4caf82', '#9b7fd4', '#e0a030', '#e05c5c'];
    const AVATARS = [{ bg: '#1e2d5a', fg: '#7ca4e8' }, { bg: '#1a3a2e', fg: '#5dc99a' }, { bg: '#3a1e1e', fg: '#e87c7c' }, { bg: '#3a2e10', fg: '#d4a84c' }, { bg: '#2a1e3a', fg: '#b07cd4' }, { bg: '#1a2e3a', fg: '#5cb8d4' }];
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show') }
    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show') }

    /*
     * LOAD DATA
     * Replace with: fetch('/api/monitor').then(r=>r.json()).then(d=>initMonitor(d)).catch(()=>initMonitor(null))
     *
     * Expected shape: {
     *   election: { title, startDate, endDate, totalVoters, votesCast, positions },
     *   positionBreakdown: [{ name, votesCast, totalVoters }],
     *   recentVotes: [{ id, name, memberId, position, time, status }],
     *   activityFeed: [{ type, title, time }]  // type: vote | auth | warn | sys
     * }
     */
    function loadData() {
      return CoopVote.api('monitor')
        .then(data => initMonitor(data))
        .catch(err => {
          initMonitor(null);
          CoopVote.toast(err.message || 'Could not load data from the server.', 'error');
        });
    }

    function initMonitor(data) {
      monitorData = data;
      renderContent();
    }

    function renderContent() {
      const c = document.getElementById('main-content');
      const lb = document.getElementById('live-badge');
      if (!monitorData || !monitorData.election) {
        lb.style.display = 'none';
        c.innerHTML = `<div class="page-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <h2>No Active Election to Monitor</h2>
      <p>Vote monitoring is only available when an election is currently running. Start an election to see real-time data here.</p>
      <a href="election-management.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Go to Election Management
      </a>
    </div>`;
        return;
      }
      lb.style.display = 'flex';
      const el = monitorData.election;
      const pct = el.totalVoters > 0 ? Math.round((el.votesCast / el.totalVoters) * 100) : 0;
      const rem = Math.max(0, el.totalVoters - el.votesCast);

      c.innerHTML = `
  <div class="stats-grid">
    <div class="stat-card gold">
      <div class="sc-header"><div class="sc-icon gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><span class="sc-badge neutral">Registered</span></div>
      <div class="sc-val">${el.totalVoters.toLocaleString()}</div><div class="sc-label">Total Registered Voters</div>
      <div class="sc-bar"><div class="sc-fill gold" style="width:100%"></div></div>
    </div>
    <div class="stat-card green">
      <div class="sc-header"><div class="sc-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div><span class="sc-badge live">Live</span></div>
      <div class="sc-val">${el.votesCast.toLocaleString()}</div><div class="sc-label">Votes Cast</div>
      <div class="sc-bar"><div class="sc-fill green" data-w="${pct}%" style="width:0%"></div></div>
    </div>
    <div class="stat-card blue">
      <div class="sc-header"><div class="sc-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><span class="sc-badge neutral">Pending</span></div>
      <div class="sc-val">${rem.toLocaleString()}</div><div class="sc-label">Yet to Vote</div>
      <div class="sc-bar"><div class="sc-fill blue" data-w="${100 - pct}%" style="width:0%"></div></div>
    </div>
    <div class="stat-card purple">
      <div class="sc-header"><div class="sc-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div><span class="sc-badge neutral">${pct}%</span></div>
      <div class="sc-val">${pct}%</div><div class="sc-label">Voter Turnout</div>
      <div class="sc-bar"><div class="sc-fill purple" data-w="${pct}%" style="width:0%"></div></div>
    </div>
  </div>
  <div class="two-col equal-height-grid">
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Votes by Position</div><div class="card-sub">${esc(el.title)}</div></div>
        <div class="live-badge"><span class="live-dot"></span>LIVE</div>
      </div>
      <div class="card-body"><div class="pos-list" id="pos-list"></div></div>
    </div>
    <div class="card" style="animation-delay:.14s">
      <div class="card-head"><div><div class="card-title">Voter Turnout</div><div class="card-sub">Participation breakdown</div></div></div>
      <div class="card-body">
        <div class="donut-wrap">
          <div class="donut-svg-wrap">
            <svg width="130" height="130" viewBox="0 0 130 130">
              <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4caf82"/><stop offset="100%" stop-color="#7be8b4"/></linearGradient></defs>
              <circle cx="65" cy="65" r="48" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="16"/>
              <circle cx="65" cy="65" r="48" fill="none" stroke="url(#dg)" stroke-width="16" stroke-dasharray="301.6" stroke-dashoffset="301.6" id="donut-arc" stroke-linecap="round"/>
              <circle cx="65" cy="65" r="48" fill="none" stroke="rgba(74,159,212,.25)" stroke-width="16" stroke-dasharray="301.6" stroke-dashoffset="0" id="donut-rem" stroke-linecap="round"/>
            </svg>
            <div class="donut-center"><div class="donut-pct">${pct}%</div><div class="donut-sub">Turnout</div></div>
          </div>
          <div class="donut-legend">
            <div class="legend-item"><div class="legend-left"><div class="legend-dot" style="background:var(--success)"></div>Voted</div><div class="legend-val">${el.votesCast.toLocaleString()}</div></div>
            <div class="legend-item"><div class="legend-left"><div class="legend-dot" style="background:rgba(74,159,212,.5)"></div>Not Voted</div><div class="legend-val">${rem.toLocaleString()}</div></div>
            <div style="padding-top:10px;border-top:1px solid var(--border);margin-top:4px">
              <div style="font-size:.7rem;color:var(--muted)">Election</div>
              <div style="font-size:.82rem;font-weight:600;margin-top:3px">${esc(el.title)}</div>
              <div style="font-size:.7rem;color:var(--muted);margin-top:2px">${el.startDate} — ${el.endDate}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="bottom-grid">
    <div class="table-card recent-votes-card">
      <div class="table-head">
        <div><div class="card-title">Recent Votes</div><div class="card-sub">Latest submissions in real time</div></div>
        <a href="security-logs.html" style="font-size:.75rem;color:var(--muted2);text-decoration:none">View Logs →</a>
      </div>
      <div class="table-scroll">
        <table class="cv-data-table cv-monitor">
              <colgroup><col style="width:8%"><col style="width:30%"><col style="width:28%"><col style="width:18%"><col style="width:16%"></colgroup>
          <thead><tr><th scope="col">No.</th><th>Voter</th><th>Position</th><th>Time</th><th>Status</th></tr></thead>
          <tbody id="votes-tbody"></tbody>
        </table>
      </div>
      <div class="pagination"><div class="pag-info" id="v-pag-info"></div><div class="pag-btns" id="v-pag-btns"></div></div>
    </div>
    <div class="table-card" style="animation-delay:.2s">
      <div class="table-head">
        <div><div class="card-title">Live Activity Feed</div><div class="card-sub">Administrator actions</div></div>
        <div class="live-badge" style="font-size:.65rem;padding:3px 9px"><span class="live-dot" style="width:5px;height:5px"></span>LIVE</div>
      </div>
      <div class="feed-list" id="feed-list"></div>
    </div>
  </div>`;

      setTimeout(() => {
        document.querySelectorAll('.sc-fill[data-w]').forEach(b => { b.style.transition = 'width 1.2s cubic-bezier(.22,1,.36,1)'; b.style.width = b.dataset.w });
        const circ = 301.6, p2 = pct / 100;
        const arc = document.getElementById('donut-arc');
        const remArc = document.getElementById('donut-rem');
        if (arc) { arc.style.transition = 'stroke-dashoffset 1.5s cubic-bezier(.22,1,.36,1)'; arc.style.strokeDashoffset = circ * (1 - p2) }
        if (remArc) { remArc.style.strokeDasharray = `${circ * (1 - p2)} ${circ}`; remArc.style.strokeDashoffset = `-${circ * p2}` }
      }, 200);

      renderPosList(); renderVotesTable(); renderFeed();
    }

    function renderPosList() {
      const list = document.getElementById('pos-list'); if (!list) return;
      const pd = monitorData?.positionBreakdown;
      if (!pd || pd.length === 0) { list.innerHTML = `<div class="empty-section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><p>No position data yet.</p></div>`; return }
      const maxV = Math.max(...pd.map(p => p.votesCast), 1);
      list.innerHTML = pd.map((p, i) => {
        const pct2 = p.totalVoters > 0 ? Math.round((p.votesCast / p.totalVoters) * 100) : 0;
        const bw = Math.round((p.votesCast / maxV) * 100);
        const col = POS_COLORS[i % POS_COLORS.length];
        return `<div>
      <div class="pos-meta"><div class="pos-name"><div class="pos-dot" style="background:${col}"></div>${esc(p.name)}</div><div class="pos-count" style="color:${col}">${p.votesCast.toLocaleString()}</div></div>
      <div class="pos-track"><div class="pos-fill" style="width:0%;background:linear-gradient(90deg,${col},${col}99)" data-w="${bw}%"></div></div>
      <div class="pos-pct">${pct2}% participation</div>
    </div>`;
      }).join('');
      setTimeout(() => { document.querySelectorAll('.pos-fill[data-w]').forEach((b, i) => { b.style.transition = `width 1.1s ${i * .08}s cubic-bezier(.22,1,.36,1)`; b.style.width = b.dataset.w }) }, 300);
    }

    function renderVotesTable() {
      const tbody = document.getElementById('votes-tbody'); const pi = document.getElementById('v-pag-info'); const pb = document.getElementById('v-pag-btns'); if (!tbody) return;
      const votes = monitorData?.recentVotes;
      if (!votes || votes.length === 0) { tbody.innerHTML = `<tr><td colspan="5"><div class="empty-section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><p>No votes cast yet.</p></div></td></tr>`; if (pi) pi.textContent = '0 votes'; if (pb) pb.innerHTML = ''; return }
      tbody.innerHTML = '';
      /* Real paging: this used to slice to the first 10 and then draw
         "1 2 ›" buttons that did nothing, so the rest was unreachable. */
      CoopVote.paginate({
        items: votes,
        pageSize: 10,
        info: 'v-pag-info',
        buttons: 'v-pag-btns',
        noun: 'vote',
        render: (rows, start) => {
          tbody.innerHTML = rows.map((v, index) => {
            const { bg, fg } = AVATARS[(v.id || 0) % AVATARS.length];
            const init = (v.name || '').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
            return `<tr><td class="row-number">${start + index + 1}</td><td><div class="voter-cell"><div class="v-avatar" style="background:${bg};color:${fg}">${init}</div><div><div style="font-weight:600;font-size:.84rem">${esc(v.name)}</div><div class="mono" style="color:var(--muted)">${esc(v.memberId)}</div></div></div></td><td style="color:var(--muted2);font-size:.8rem">${esc(v.position)}</td><td class="mono" style="color:var(--muted);font-size:.72rem">${v.time}</td><td><span class="badge badge-green">Verified</span></td></tr>`;
          }).join('');
        },
      });
    }

    function renderFeed() {
      const feed = document.getElementById('feed-list'); if (!feed) return;
      const items = monitorData?.activityFeed;
      if (!items || items.length === 0) { feed.innerHTML = `<div class="empty-section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><p>No activity yet.</p></div>`; return }
      feed.innerHTML = items.slice(0, 8).map(a => `<div class="feed-item"><div class="feed-dot ${a.type}"></div><div class="feed-info"><div class="feed-title">${esc(a.title)}</div><div class="feed-time">${a.time}</div></div></div>`).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      CoopVote.guard('admin').then(() => CoopVote.startLive('monitor', initMonitor));
      /*
       * When backend is ready, replace loadData() with:
       * fetch('/api/monitor').then(r=>r.json()).then(d=>initMonitor(d)).catch(()=>initMonitor(null));
       * Then add polling:
       * setInterval(()=>fetch('/api/monitor').then(r=>r.json()).then(d=>initMonitor(d)),15000);
       */
    });
  </script>
</body>

</html>
